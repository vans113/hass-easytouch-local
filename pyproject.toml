[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "ASYNC", "RUF", "I"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
