name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import json;print(json.load(open('custom_components/easytouch_local/manifest.json'))['version'])")
          [ "$tag" = "$ver" ] || { echo "Tag $tag != manifest $ver"; exit 1; }
      # Published (not draft) so HACS can see it immediately.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
